resources:
  jobs:
    capstone5_iot_pipeline:
      name: capstone5_iot_pipeline
      tasks:
        - task_key: bronze_adls_autoloader
          notebook_task:
            notebook_path: /Workspace/Users/datauser47@financecloudbrick.onmicrosoft.com/capstone05_iot_lakehouse/final/01_bronze/2_adls_dataload_and_autoloader
            source: WORKSPACE
        - task_key: bronze_azure_sql
          notebook_task:
            notebook_path: /Workspace/Users/datauser47@financecloudbrick.onmicrosoft.com/capstone05_iot_lakehouse/final/01_bronze/1_azure_dataload
            source: WORKSPACE
          environment_key: Default
        - task_key: data_profile
          depends_on:
            - task_key: bronze_adls_autoloader
            - task_key: bronze_azure_sql
          notebook_task:
            notebook_path: /Workspace/Users/datauser47@financecloudbrick.onmicrosoft.com/capstone05_iot_lakehouse/final/01_bronze/3_data_profile
            source: WORKSPACE
        - task_key: silver_transform
          depends_on:
            - task_key: data_profile
          notebook_task:
            notebook_path: /Workspace/Users/datauser47@financecloudbrick.onmicrosoft.com/capstone05_iot_lakehouse/final/02_silver/4_day2_silver
            source: WORKSPACE
        - task_key: gold_build
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: /Workspace/Users/datauser47@financecloudbrick.onmicrosoft.com/capstone05_iot_lakehouse/final/03_gold/5_day3_gold
            source: WORKSPACE
        - task_key: validate
          depends_on:
            - task_key: gold_build
          notebook_task:
            notebook_path: /Workspace/Users/datauser47@financecloudbrick.onmicrosoft.com/capstone05_iot_lakehouse/final/6_day4_pipeline_validate
            base_parameters:
              run_id: "{{job.run_id}}"
            source: WORKSPACE
          environment_key: Default
        - task_key: dashboard_refresh
          depends_on:
            - task_key: validate
          notebook_task:
            notebook_path: /Workspace/Users/datauser47@financecloudbrick.onmicrosoft.com/capstone05_iot_lakehouse/final/7_day4_monitoring_refresh
            base_parameters:
              run_id: "{{job.run_id}}"
            source: WORKSPACE
          environment_key: Default
      queue:
        enabled: true
      parameters:
        - name: bronze_schema
          default: iot_schema
        - name: catalog
          default: capstone_5iot
        - name: gold_schema
          default: gold
        - name: run_id
          default: "{{job.run_id}}"
        - name: silver_schema
          default: silver
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
